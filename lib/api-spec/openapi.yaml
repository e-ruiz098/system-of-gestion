openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Sistema de Gestión Comercial - POS + Inventario
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: config
    description: Business configuration
  - name: usuarios
    description: User management
  - name: categorias
    description: Product categories
  - name: productos
    description: Product management
  - name: ventas
    description: Sales
  - name: devoluciones
    description: Returns
  - name: caja
    description: Cash register operations
  - name: dashboard
    description: Dashboard summaries

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current session user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated

  # CONFIG / ONBOARDING
  /config:
    get:
      operationId: getConfig
      tags: [config]
      summary: Get business configuration
      responses:
        "200":
          description: Config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
        "404":
          description: Not configured yet

  /config/setup:
    post:
      operationId: setupConfig
      tags: [config]
      summary: Initial onboarding setup (creates DB and admin user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupInput"
      responses:
        "201":
          description: Setup complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

  /config/update:
    put:
      operationId: updateConfig
      tags: [config]
      summary: Update business configuration (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigUpdate"
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"

  # USUARIOS
  /usuarios:
    get:
      operationId: getUsuarios
      tags: [usuarios]
      summary: List all users (admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Usuario"
    post:
      operationId: createUsuario
      tags: [usuarios]
      summary: Create a new user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"

  /usuarios/{id}:
    put:
      operationId: updateUsuario
      tags: [usuarios]
      summary: Update user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
    delete:
      operationId: deleteUsuario
      tags: [usuarios]
      summary: Delete user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted

  # CATEGORIAS
  /categorias:
    get:
      operationId: getCategorias
      tags: [categorias]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Categoria"
    post:
      operationId: createCategoria
      tags: [categorias]
      summary: Create a category (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Categoria"

  /categorias/{id}:
    put:
      operationId: updateCategoria
      tags: [categorias]
      summary: Update category (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaInput"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Categoria"
    delete:
      operationId: deleteCategoria
      tags: [categorias]
      summary: Delete category (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted

  # PRODUCTOS
  /productos:
    get:
      operationId: getProductos
      tags: [productos]
      summary: List products (with optional search, category, active filter)
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search by name or code
        - name: categoria_id
          in: query
          schema:
            type: integer
        - name: activo
          in: query
          schema:
            type: boolean
        - name: stock_bajo
          in: query
          schema:
            type: boolean
          description: Only return products with low stock
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Producto"
    post:
      operationId: createProducto
      tags: [productos]
      summary: Create a product (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductoInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"

  /productos/{id}:
    get:
      operationId: getProducto
      tags: [productos]
      summary: Get a product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
    put:
      operationId: updateProducto
      tags: [productos]
      summary: Update a product (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductoUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
    delete:
      operationId: deleteProducto
      tags: [productos]
      summary: Delete or deactivate a product (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted or deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteProductoResult"

  /productos/{id}/toggle-activo:
    patch:
      operationId: toggleProductoActivo
      tags: [productos]
      summary: Toggle product active/inactive (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"

  /productos/import:
    post:
      operationId: importProductos
      tags: [productos]
      summary: Import products from CSV data (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportProductosInput"
      responses:
        "200":
          description: Import results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"

  # VENTAS
  /ventas:
    get:
      operationId: getVentas
      tags: [ventas]
      summary: List sales (admin only, filterable by date)
      parameters:
        - name: fecha_desde
          in: query
          schema:
            type: string
        - name: fecha_hasta
          in: query
          schema:
            type: string
        - name: usuario_id
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Venta"
    post:
      operationId: createVenta
      tags: [ventas]
      summary: Create a new sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VentaInput"
      responses:
        "201":
          description: Created sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venta"

  /ventas/{id}:
    get:
      operationId: getVenta
      tags: [ventas]
      summary: Get a sale with its detail lines
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sale with detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VentaDetalle"
    delete:
      operationId: anularVenta
      tags: [ventas]
      summary: Void/cancel a sale (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sale voided

  # DEVOLUCIONES
  /devoluciones:
    get:
      operationId: getDevoluciones
      tags: [devoluciones]
      summary: List returns
      parameters:
        - name: fecha_desde
          in: query
          schema:
            type: string
        - name: fecha_hasta
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of returns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Devolucion"
    post:
      operationId: createDevolucion
      tags: [devoluciones]
      summary: Create a return
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevolucionInput"
      responses:
        "201":
          description: Created return
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Devolucion"

  # CAJA
  /caja/apertura:
    post:
      operationId: abrirCaja
      tags: [caja]
      summary: Open cash register for the day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AperturaCajaInput"
      responses:
        "201":
          description: Cash register opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AperturaCaja"

  /caja/activa:
    get:
      operationId: getCajaActiva
      tags: [caja]
      summary: Get the currently open cash register session
      responses:
        "200":
          description: Active cash register session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CajaActiva"
        "404":
          description: No active session

  /caja/cierre:
    post:
      operationId: cerrarCaja
      tags: [caja]
      summary: Close the cash register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CierreCajaInput"
      responses:
        "201":
          description: Cash register closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CierreCaja"

  /caja/cierres:
    get:
      operationId: getCierresCaja
      tags: [caja]
      summary: List all cash register closings (admin only)
      responses:
        "200":
          description: List of closings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CierreCaja"

  /caja/cierres/{id}:
    get:
      operationId: getCierreCaja
      tags: [caja]
      summary: Get a specific cash register closing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cash register closing detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CierreCaja"

  # DASHBOARD
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary (admin only)
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"

  /dashboard/ventas-por-dia:
    get:
      operationId: getVentasPorDia
      tags: [dashboard]
      summary: Get sales per day for last 30 days
      responses:
        "200":
          description: Sales per day
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VentaDia"

  /dashboard/productos-top:
    get:
      operationId: getProductosTop
      tags: [dashboard]
      summary: Get top selling products
      responses:
        "200":
          description: Top products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductoTop"

  /dashboard/stock-alerta:
    get:
      operationId: getStockAlerta
      tags: [dashboard]
      summary: Get products with low or zero stock
      responses:
        "200":
          description: Stock alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockAlerta"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # AUTH
    LoginInput:
      type: object
      required: [nombre, password]
      properties:
        nombre:
          type: string
        password:
          type: string

    AuthUser:
      type: object
      required: [id, nombre, rol]
      properties:
        id:
          type: integer
        nombre:
          type: string
        rol:
          type: string
          enum: [admin, vendedor]

    # CONFIG
    Config:
      type: object
      required: [id, nombre_empresa, moneda, emite_tickets, tema_color, stock_bajo_umbral_global, dias_retencion_tickets]
      properties:
        id:
          type: integer
        nombre_empresa:
          type: string
        logo_path:
          type: ["string", "null"]
        direccion:
          type: ["string", "null"]
        telefono:
          type: ["string", "null"]
        identificador_fiscal:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        moneda:
          type: string
        emite_tickets:
          type: boolean
        impresora_seleccionada:
          type: ["string", "null"]
        dias_retencion_tickets:
          type: integer
        tema_color:
          type: string
        stock_bajo_umbral_global:
          type: integer
        fecha_instalacion:
          type: ["string", "null"]

    SetupInput:
      type: object
      required: [nombre_empresa, moneda, admin_nombre, admin_password, tema_color, dias_retencion_tickets, emite_tickets, stock_bajo_umbral_global]
      properties:
        nombre_empresa:
          type: string
        logo_path:
          type: string
        direccion:
          type: string
        telefono:
          type: string
        identificador_fiscal:
          type: string
        email:
          type: string
        moneda:
          type: string
        emite_tickets:
          type: boolean
        impresora_seleccionada:
          type: string
        dias_retencion_tickets:
          type: integer
        tema_color:
          type: string
        stock_bajo_umbral_global:
          type: integer
        admin_nombre:
          type: string
        admin_password:
          type: string

    ConfigUpdate:
      type: object
      properties:
        nombre_empresa:
          type: string
        logo_path:
          type: ["string", "null"]
        direccion:
          type: ["string", "null"]
        telefono:
          type: ["string", "null"]
        identificador_fiscal:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        moneda:
          type: string
        emite_tickets:
          type: boolean
        impresora_seleccionada:
          type: ["string", "null"]
        dias_retencion_tickets:
          type: integer
        tema_color:
          type: string
        stock_bajo_umbral_global:
          type: integer

    # USUARIOS
    Usuario:
      type: object
      required: [id, nombre, rol, activo, creado_en]
      properties:
        id:
          type: integer
        nombre:
          type: string
        rol:
          type: string
          enum: [admin, vendedor]
        activo:
          type: boolean
        creado_en:
          type: string

    UsuarioInput:
      type: object
      required: [nombre, password, rol]
      properties:
        nombre:
          type: string
        password:
          type: string
        rol:
          type: string
          enum: [admin, vendedor]

    UsuarioUpdate:
      type: object
      properties:
        nombre:
          type: string
        password:
          type: ["string", "null"]
        rol:
          type: string
          enum: [admin, vendedor]
        activo:
          type: boolean

    # CATEGORIAS
    Categoria:
      type: object
      required: [id, nombre]
      properties:
        id:
          type: integer
        nombre:
          type: string

    CategoriaInput:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string

    # PRODUCTOS
    Producto:
      type: object
      required: [id, nombre, precio, stock, activo, creado_en]
      properties:
        id:
          type: integer
        codigo:
          type: ["string", "null"]
        nombre:
          type: string
        precio:
          type: number
        costo:
          type: ["number", "null"]
        stock:
          type: integer
        stock_minimo:
          type: ["integer", "null"]
        categoria_id:
          type: ["integer", "null"]
        categoria_nombre:
          type: ["string", "null"]
        activo:
          type: boolean
        creado_en:
          type: string
        stock_estado:
          type: string
          enum: [rojo, amarillo, verde]

    ProductoInput:
      type: object
      required: [nombre, precio, stock]
      properties:
        codigo:
          type: string
        nombre:
          type: string
        precio:
          type: number
        costo:
          type: number
        stock:
          type: integer
        stock_minimo:
          type: integer
        categoria_id:
          type: integer

    ProductoUpdate:
      type: object
      properties:
        codigo:
          type: ["string", "null"]
        nombre:
          type: string
        precio:
          type: number
        costo:
          type: ["number", "null"]
        stock:
          type: integer
        stock_minimo:
          type: ["integer", "null"]
        categoria_id:
          type: ["integer", "null"]
        activo:
          type: boolean

    DeleteProductoResult:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [deleted, deactivated]
        message:
          type: string

    ImportProductosInput:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            type: object
            properties:
              codigo:
                type: string
              nombre:
                type: string
              precio:
                type: number
              costo:
                type: number
              stock:
                type: integer
              categoria:
                type: string
            required: [nombre, precio, stock]

    ImportResult:
      type: object
      required: [created, updated, errors]
      properties:
        created:
          type: integer
        updated:
          type: integer
        errors:
          type: integer

    # VENTAS
    DetalleVentaInput:
      type: object
      required: [producto_id, cantidad, precio_unitario, subtotal]
      properties:
        producto_id:
          type: integer
        cantidad:
          type: integer
        precio_unitario:
          type: number
        subtotal:
          type: number

    VentaInput:
      type: object
      required: [total, metodo_pago, detalle]
      properties:
        apertura_caja_id:
          type: ["integer", "null"]
        total:
          type: number
        metodo_pago:
          type: string
          enum: [efectivo, tarjeta, transferencia, mixto]
        detalle_pago_mixto:
          type: ["string", "null"]
        detalle:
          type: array
          items:
            $ref: "#/components/schemas/DetalleVentaInput"

    DetalleVenta:
      type: object
      required: [id, venta_id, producto_id, cantidad, precio_unitario, subtotal]
      properties:
        id:
          type: integer
        venta_id:
          type: integer
        producto_id:
          type: integer
        producto_nombre:
          type: ["string", "null"]
        cantidad:
          type: integer
        precio_unitario:
          type: number
        subtotal:
          type: number

    Venta:
      type: object
      required: [id, numero_ticket, total, metodo_pago, fecha, anulada]
      properties:
        id:
          type: integer
        numero_ticket:
          type: integer
        usuario_id:
          type: ["integer", "null"]
        usuario_nombre:
          type: ["string", "null"]
        apertura_caja_id:
          type: ["integer", "null"]
        total:
          type: number
        metodo_pago:
          type: string
        detalle_pago_mixto:
          type: ["string", "null"]
        fecha:
          type: string
        anulada:
          type: boolean

    VentaDetalle:
      type: object
      required: [id, numero_ticket, total, metodo_pago, fecha, anulada, detalle]
      properties:
        id:
          type: integer
        numero_ticket:
          type: integer
        usuario_id:
          type: ["integer", "null"]
        usuario_nombre:
          type: ["string", "null"]
        apertura_caja_id:
          type: ["integer", "null"]
        total:
          type: number
        metodo_pago:
          type: string
        detalle_pago_mixto:
          type: ["string", "null"]
        fecha:
          type: string
        anulada:
          type: boolean
        detalle:
          type: array
          items:
            $ref: "#/components/schemas/DetalleVenta"

    # DEVOLUCIONES
    DetalleDevolucionInput:
      type: object
      required: [producto_id, cantidad]
      properties:
        producto_id:
          type: integer
        cantidad:
          type: integer

    DevolucionInput:
      type: object
      required: [venta_id, detalle]
      properties:
        venta_id:
          type: integer
        motivo:
          type: string
        detalle:
          type: array
          items:
            $ref: "#/components/schemas/DetalleDevolucionInput"

    DetalleDevolucion:
      type: object
      required: [id, devolucion_id, producto_id, cantidad]
      properties:
        id:
          type: integer
        devolucion_id:
          type: integer
        producto_id:
          type: integer
        producto_nombre:
          type: ["string", "null"]
        cantidad:
          type: integer

    Devolucion:
      type: object
      required: [id, venta_id, fecha]
      properties:
        id:
          type: integer
        venta_id:
          type: integer
        numero_ticket:
          type: ["integer", "null"]
        usuario_id:
          type: ["integer", "null"]
        usuario_nombre:
          type: ["string", "null"]
        motivo:
          type: ["string", "null"]
        fecha:
          type: string
        detalle:
          type: array
          items:
            $ref: "#/components/schemas/DetalleDevolucion"

    # CAJA
    AperturaCajaInput:
      type: object
      required: [fondo_inicial]
      properties:
        fondo_inicial:
          type: number

    AperturaCaja:
      type: object
      required: [id, fondo_inicial, fecha_apertura]
      properties:
        id:
          type: integer
        usuario_id:
          type: ["integer", "null"]
        usuario_nombre:
          type: ["string", "null"]
        fondo_inicial:
          type: number
        fecha_apertura:
          type: string
        cierre_id:
          type: ["integer", "null"]

    CajaActiva:
      type: object
      required: [apertura, total_efectivo, total_ventas, cantidad_ventas]
      properties:
        apertura:
          $ref: "#/components/schemas/AperturaCaja"
        total_efectivo:
          type: number
        total_tarjeta:
          type: number
        total_transferencia:
          type: number
        total_ventas:
          type: number
        cantidad_ventas:
          type: integer
        total_esperado:
          type: number

    CierreCajaInput:
      type: object
      required: [total_contado]
      properties:
        total_contado:
          type: number

    CierreCaja:
      type: object
      required: [id, apertura_caja_id, total_esperado, total_contado, diferencia, fecha_cierre]
      properties:
        id:
          type: integer
        apertura_caja_id:
          type: integer
        usuario_id:
          type: ["integer", "null"]
        usuario_nombre:
          type: ["string", "null"]
        total_esperado:
          type: number
        total_contado:
          type: number
        diferencia:
          type: number
        fecha_cierre:
          type: string
        snapshot_stock:
          type: ["string", "null"]
        apertura:
          $ref: "#/components/schemas/AperturaCaja"

    # DASHBOARD
    Dashboard:
      type: object
      required: [ventas_hoy, ingresos_hoy, ventas_mes, ingresos_mes, productos_activos, productos_stock_bajo, productos_agotados]
      properties:
        ventas_hoy:
          type: integer
        ingresos_hoy:
          type: number
        ventas_mes:
          type: integer
        ingresos_mes:
          type: number
        productos_activos:
          type: integer
        productos_stock_bajo:
          type: integer
        productos_agotados:
          type: integer
        caja_activa:
          type: boolean

    VentaDia:
      type: object
      required: [fecha, total_ventas, ingresos]
      properties:
        fecha:
          type: string
        total_ventas:
          type: integer
        ingresos:
          type: number

    ProductoTop:
      type: object
      required: [producto_id, nombre, cantidad_vendida, ingresos]
      properties:
        producto_id:
          type: integer
        nombre:
          type: string
        cantidad_vendida:
          type: integer
        ingresos:
          type: number

    StockAlerta:
      type: object
      required: [agotados, stock_bajo]
      properties:
        agotados:
          type: array
          items:
            $ref: "#/components/schemas/Producto"
        stock_bajo:
          type: array
          items:
            $ref: "#/components/schemas/Producto"
